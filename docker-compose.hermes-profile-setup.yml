# One-shot: seed gemini-cookie profile into Hermes WebUI volume on VPS.
# Deploy via Hostinger MCP, then remove this project after success.

services:
  setup:
    image: alpine:3.20
    restart: "no"
    environment:
      PROFILE_NAME: gemini-cookie
      CONFIG_URL: https://raw.githubusercontent.com/raj4ever/gemini/main/vps/hermes-profile-gemini-cookie/config.yaml
      HERMES_API_KEY: ${HERMES_API_KEY:-sk-gemini-cookie-local}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_HOME_CHANNEL: ${TELEGRAM_HOME_CHANNEL:-}
      TELEGRAM_HOME_CHANNEL_THREAD_ID: ${TELEGRAM_HOME_CHANNEL_THREAD_ID:-}
    volumes:
      - hermes-home:/data
    command:
      - sh
      - -ec
      - |
        set -eu
        PROFILE="$${PROFILE_NAME}"
        DIR="/data/profiles/$${PROFILE}"
        mkdir -p "$${DIR}"
        wget -qO "$${DIR}/config.yaml" "$${CONFIG_URL}"
        TG_BLOCK=""
        if [ -n "$${TELEGRAM_BOT_TOKEN}" ]; then
          TG_BLOCK="TELEGRAM_BOT_TOKEN=$${TELEGRAM_BOT_TOKEN}
TELEGRAM_ALLOWED_USERS=$${TELEGRAM_ALLOWED_USERS}
TELEGRAM_HOME_CHANNEL=$${TELEGRAM_HOME_CHANNEL}
TELEGRAM_HOME_CHANNEL_THREAD_ID=$${TELEGRAM_HOME_CHANNEL_THREAD_ID}
"
        fi
        {
          echo "HERMES_API_KEY=$${HERMES_API_KEY}"
          printf '%s' "$${TG_BLOCK}"
        } > "$${DIR}/.env"
        if [ -n "$${TELEGRAM_BOT_TOKEN}" ]; then
          {
            echo "HERMES_API_KEY=$${HERMES_API_KEY}"
            printf '%s' "$${TG_BLOCK}"
          } > /data/.env
        fi
        mkdir -p /data/bin
        wget -qO /data/bin/hermes https://raw.githubusercontent.com/raj4ever/gemini/main/vps/hermes-bin/hermes
        chmod 755 /data/bin/hermes
        printf '%s\n' "$${PROFILE}" > /data/active_profile
        chmod 600 "$${DIR}/.env"
        rm -f "$${DIR}/gateway.pid" "$${DIR}/processes.json"
        printf '%s\n' '{"gateway_state":"running","platforms":{}}' > "$${DIR}/gateway_state.json"
        chown -R 1000:1000 "$${DIR}" /data/active_profile /data/bin /data/.env 2>/dev/null || true
        echo "OK: profile $${PROFILE} + gateway_state=running"

volumes:
  hermes-home:
    external: true
    name: hermes-webui-mxnj_hermes-home
