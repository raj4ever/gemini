# Hostinger VPS + Traefik (Hermes WebUI jaisa auto HTTPS domain)
# URL: https://${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}/
# Example project "gemini-cookie" → https://gemini-cookie.srv1721950.hstgr.cloud/

services:
  gemini-cookie:
    container_name: gemini-cookie
    build:
      context: https://github.com/${GITHUB_REPO:-raj4ever/gemini}.git
      dockerfile: Dockerfile
    image: gemini-cookie:local
    ports:
      - "8765"
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`gemini-cookie.${TRAEFIK_HOST:-srv1721950.hstgr.cloud}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8765
    volumes:
      - gemini-cache:/app/.gemini_cache
    environment:
      GEMINI_HOST: "0.0.0.0"
      GEMINI_PORT: "8765"
      GEMINI_COOKIES_PATH: /app/cookies.json
      GEMINI_COOKIES_B64: ${GEMINI_COOKIES_B64:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-sk-gemini-cookie-local}
      GEMINI_DEFAULT_MODEL: ${GEMINI_DEFAULT_MODEL:-gemini-3-flash}
      GEMINI_NATIVE_STREAM: "false"
      GEMINI_MAX_ATTEMPTS: "3"
      GEMINI_SEND_TIMEOUT: "120"
      GEMINI_STREAM_KEEPALIVE_SEC: "12"
      GEMINI_AGENT_MAX_TOOLS: "30"
      GEMINI_AGENT_MAX_MESSAGES: "24"
    networks:
      - default
      - hermes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8765/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  hermes:
    external: true
    name: hermes-webui-mxnj_default

volumes:
  gemini-cache:
