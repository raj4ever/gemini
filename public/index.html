<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Chat (Cookies)</title>
    <style>
      :root {
        --bg: #131314;
        --surface: #1e1f20;
        --surface-2: #282a2c;
        --border: #3c4043;
        --text: #e3e3e3;
        --muted: #9aa0a6;
        --accent: #8ab4f8;
        --user: #394457;
        --bot: #282a2c;
        --danger: #f28b82;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Google Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--surface);
      }
      header h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 500;
      }
      .status {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .status.ok {
        color: #81c995;
      }
      .status.err {
        color: var(--danger);
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .msg {
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
        padding: 14px 18px;
        border-radius: 18px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user);
        border-bottom-right-radius: 4px;
      }
      .msg.bot {
        align-self: flex-start;
        background: var(--bot);
        border-bottom-left-radius: 4px;
      }
      .msg.error {
        border: 1px solid var(--danger);
        color: var(--danger);
      }
      .composer {
        padding: 16px 20px 24px;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }
      .composer-inner {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      textarea {
        flex: 1;
        resize: none;
        min-height: 48px;
        max-height: 160px;
        padding: 12px 16px;
        border-radius: 24px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        font: inherit;
        outline: none;
      }
      textarea:focus {
        border-color: var(--accent);
      }
      button {
        border: none;
        border-radius: 24px;
        padding: 12px 20px;
        font: inherit;
        cursor: pointer;
        background: var(--accent);
        color: #131314;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .hint {
        max-width: 760px;
        margin: 8px auto 0;
        font-size: 0.75rem;
        color: var(--muted);
        text-align: center;
      }
      .typing::after {
        content: "▋";
        animation: blink 1s step-end infinite;
        margin-left: 2px;
        color: var(--accent);
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Gemini Chat</h1>
      <div style="display: flex; gap: 8px; align-items: center">
        <span id="status" class="status">Connecting…</span>
        <button type="button" class="secondary" id="newChat" title="Nayi chat">New chat</button>
      </div>
    </header>

    <main id="messages"></main>

    <div class="composer">
      <form class="composer-inner" id="form">
        <textarea
          id="input"
          rows="1"
          placeholder="Apna message likho… (Enter = bhejo, Shift+Enter = nayi line)"
          autocomplete="off"
        ></textarea>
        <button type="submit" id="send">Bhejo</button>
      </form>
      <p class="hint">Server: <code>http://127.0.0.1:8765</code> — cookies <code>cookies.json</code> se</p>
    </div>

    <script>
      const messagesEl = document.getElementById("messages");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const statusEl = document.getElementById("status");
      const newChatBtn = document.getElementById("newChat");

      let sessionId = "default";
      let busy = false;

      function addMessage(role, text, extraClass = "") {
        const el = document.createElement("div");
        el.className = `msg ${role} ${extraClass}`.trim();
        el.textContent = text;
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return el;
      }

      async function checkHealth() {
        try {
          const res = await fetch("/api/health");
          const data = await res.json();
          if (data.ok) {
            statusEl.textContent = "Ready";
            statusEl.className = "status ok";
          } else {
            statusEl.textContent = "Cookies / init error";
            statusEl.className = "status err";
          }
        } catch {
          statusEl.textContent = "Server offline";
          statusEl.className = "status err";
        }
      }

      async function newSession() {
        try {
          const res = await fetch("/api/session/new", { method: "POST" });
          const data = await res.json();
          sessionId = data.session_id;
          messagesEl.innerHTML = "";
          addMessage("bot", "Nayi chat shuru. Kuch bhi pucho!");
        } catch (e) {
          addMessage("bot", "Session nahi bani: " + e.message, "error");
        }
      }

      async function sendMessagePlain(text, botEl) {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || "Request failed");
        }
        const data = await res.json();
        botEl.textContent = data.text || "(empty reply)";
      }

      async function sendMessageStream(text, botEl) {
        const res = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || "Request failed");
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let full = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop() || "";

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const payload = JSON.parse(line.slice(6));
            if (payload.error) throw new Error(payload.error);
            if (payload.delta) {
              full += payload.delta;
              botEl.textContent = full;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
            if (payload.done) {
              botEl.textContent = payload.text || full;
            }
          }
        }
      }

      async function sendMessage(text) {
        busy = true;
        sendBtn.disabled = true;
        addMessage("user", text);
        const botEl = addMessage("bot", "");
        botEl.classList.add("typing");

        try {
          await sendMessagePlain(text, botEl);
        } catch (e) {
          botEl.textContent = "Error: " + e.message;
          botEl.classList.add("error");
        } finally {
          botEl.classList.remove("typing");
          busy = false;
          sendBtn.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || busy) return;
        input.value = "";
        input.style.height = "auto";
        sendMessage(text);
      });

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 160) + "px";
      });

      newChatBtn.addEventListener("click", newSession);

      checkHealth();
      setInterval(checkHealth, 15000);
      newSession();
    </script>
  </body>
</html>
